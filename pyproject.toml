[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tensile"
version = "0.1.0"
description = "A readable, educational deep learning framework written from scratch in pure NumPy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "torch>=2.0.0",
    "graphviz>=0.20.0",
]
visualizer = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["tensile*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["manim"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
