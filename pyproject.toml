[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tensile"
version = "0.1.0"
description = "A readable, educational deep learning framework written from scratch in pure NumPy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "graphviz>=0.20.0",
]
